version: "3.8"

services:
  # ─── 1. PostgreSQL Database ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: interviewprep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword123
      POSTGRES_DB: interviewprep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprep"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 2. Redis 7 Cache & Ephemeral Presence ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: interviewprep-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass redispassword123
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── 3. Apache Kafka (KRaft Single-Node Mode) ──────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: interviewprep-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server 127.0.0.1:9092 || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── 4. MinIO S3-Compatible Object Storage ──────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-03-05T04-48-44Z
    container_name: interviewprep-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-03-05T04-48-44Z
    container_name: interviewprep-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword123;
      /usr/bin/mc mb --ignore-existing local/interviewprep-recordings-private;
      /usr/bin/mc anonymous set none local/interviewprep-recordings-private;
      exit 0;
      "

  # ─── 5. LiveKit SFU (WebRTC Media Plane) ───────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.6.0
    container_name: interviewprep-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --keys "devkey: secret_livekit_api_key_must_be_secured"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    volumes:
      - ./config/livekit/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7880/ || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── 6. Prometheus Metrics Scraper ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: interviewprep-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  redisdata:
  kafkadata:
  miniodata:
