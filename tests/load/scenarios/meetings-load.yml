# Scenario B+C: Meeting Creation & Join Load Test
# Phase 15: Performance, Scalability & Load Testing
#
# Tests: Meeting creation + participant join + lifecycle under load
# Target: /api/v1/meetings endpoints (local dev server only)
#
# Expected targets:
#   - Meeting creation p95 < 500ms
#   - Meeting join p95 < 1000ms
#   - Active meeting list p95 < 200ms
#   - Error rate < 2%
#
# Run: npx artillery@latest run tests/load/scenarios/meetings-load.yml

config:
  target: "http://localhost:5173"
  phases:
    - name: "Ramp up"
      duration: 60
      arrivalRate: 1
      rampTo: 15
    - name: "Peak load"
      duration: 120
      arrivalRate: 15
    - name: "Ramp down"
      duration: 30
      arrivalRate: 5
  http:
    timeout: 15
  defaults:
    headers:
      Content-Type: "application/json"
      # Mock admin token — in real load test, obtain via auth scenario first
      Authorization: "Bearer load_test_mock_token_phase15"

scenarios:
  - name: "Meeting creation and status check"
    weight: 40
    flow:
      - post:
          url: "/api/v1/meetings"
          json:
            title: "Load Test Meeting {{ $randomInt(1000, 9999) }}"
            type: "INTERVIEW"
            scheduledAt: "{{ $timestamp }}"
            maxParticipants: 10
          capture:
            - json: "$.id"
              as: "meetingId"
          expect:
            - statusCode:
                - 200
                - 201
                - 400  # Expected if auth fails in test env
      - think: 2

      # Fetch meeting details (cache validation)
      - get:
          url: "/api/v1/meetings/{{ meetingId }}"
          expect:
            - statusCode:
                - 200
                - 404  # Meeting may not exist in mock env

  - name: "Active meetings list pagination"
    weight: 40
    flow:
      - get:
          url: "/api/v1/meetings?status=ACTIVE&limit=20&offset=0"
          expect:
            - statusCode:
                - 200
                - 401
      - think: 1
      - get:
          url: "/api/v1/meetings?status=ACTIVE&limit=20&offset=20"
          expect:
            - statusCode:
                - 200
                - 401

  - name: "Metrics and health check under meeting load"
    weight: 20
    flow:
      - get:
          url: "/api/v1/health"
          expect:
            - statusCode: 200
      - get:
          url: "/api/v1/performance"
          expect:
            - statusCode: 200
